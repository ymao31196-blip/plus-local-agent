[package]
name = "pla-desktop"
version = "1.0.0-rc.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
winreg = "0.55"

[profile.release]
strip = true
lto = true
codegen-units = 1
