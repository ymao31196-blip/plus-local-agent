[package]
name = "pla-desktop"
version = "1.2.0"
edition = "2021"

license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-updater = "=2.11.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
winreg = "0.55"

# Preserve the Tauri bundle-type marker for Windows signed updater builds.
# Stripping release binaries can remove the marker needed by the bundler.
[profile.release]
strip = false
lto = true
codegen-units = 1
